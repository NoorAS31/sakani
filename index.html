<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/sakani-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>sakani</title>
</head>
  <body>
    <script>
      (function () {
        const redirectPath = sessionStorage.getItem('spa:redirectPath');
        if (!redirectPath) return;
        sessionStorage.removeItem('spa:redirectPath');
        const normalizedPath = redirectPath.startsWith('/')
          ? redirectPath
          : `/${redirectPath}`;
        history.replaceState(null, '', normalizedPath);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
